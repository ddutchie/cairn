name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  PKG_CACHE_PATH: ${{ github.workspace }}/.cache/pkg

jobs:
  # ── Create the GitHub Release with changelog body ─────────────────────────
  prepare-release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE="changelogs/${TAG}.md"
          PRERELEASE=""
          if [[ "$TAG" == *"-"* ]]; then PRERELEASE="--prerelease"; fi
          # Create as a draft first so the platform build jobs can upload their
          # DMG/installer assets to it. The final `publish-release` job flips the
          # draft off and marks it `latest` only after all three builds
          # pass — so a failed build leaves the release as an unpublished draft
          # (never shipped to auto-update users). To inspect a packaged build
          # before it goes public, cancel/fail the run or gate publish-release.
          if [ -f "$FILE" ]; then
            gh release create "$TAG" \
              --title "Cairn ${TAG}" \
              --notes-file "$FILE" \
              --draft \
              $PRERELEASE
          else
            gh release create "$TAG" \
              --title "Cairn ${TAG}" \
              --notes "No changelog found for ${TAG}." \
              --draft \
              $PRERELEASE
          fi

  # ── Platform-independent build, done once ─────────────────────────────────
  # Generated files + Next static export + esbuild bundles don't depend on the
  # target OS, so build them once and hand the result to each platform job
  # instead of repeating it three times (four with the mac arch split).
  build-web:
    name: Build web + bundles
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm

      # Hash of the dependency tree with the project's own version stripped.
      # The release script bumps `version` in package-lock.json on every tag, so
      # hashFiles('package-lock.json') missed every cache on every release.
      - name: Compute dependency hash
        id: deps
        shell: bash
        run: |
          echo "hash=$(node -e "const l=require('./package-lock.json');delete l.version;if(l.packages&&l.packages[''])delete l.packages[''].version;process.stdout.write(require('crypto').createHash('sha256').update(JSON.stringify(l)).digest('hex'))")" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules
          key: npm-deps-web-${{ runner.os }}-${{ runner.arch }}-node-24-${{ steps.deps.outputs.hash }}

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ runner.arch }}-${{ steps.deps.outputs.hash }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ runner.arch }}-${{ steps.deps.outputs.hash }}-
            nextjs-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate, build, compile
        run: |
          node scripts/generate-licenses.js
          node scripts/generate-features.js
          npx cross-env ELECTRON_BUILD=true npx next build
          npm run compile

      # `assets/` is staged by compile-electron.js and shipped via electron-builder.yml.
      - name: Upload web build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: web-build
          path: |
            out
            dist-electron
            dist-mcp/mcp-server.bundle.js
            assets
          if-no-files-found: error
          retention-days: 1

  # ── macOS ─────────────────────────────────────────────────────────────────
  # arm64 and x64 build in parallel: notarization (~4 min per arch, Apple-side)
  # used to run back to back inside one electron-builder invocation. Assets are
  # NOT published from here — each arch's latest-mac.yml lists only its own
  # files, so `publish-release` merges them and uploads everything.
  build-mac:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    needs: [prepare-release, build-web]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm

      # Hash of the dependency tree with the project's own version stripped.
      # The release script bumps `version` in package-lock.json on every tag, so
      # hashFiles('package-lock.json') missed every cache on every release.
      - name: Compute dependency hash
        id: deps
        shell: bash
        run: |
          echo "hash=$(node -e "const l=require('./package-lock.json');delete l.version;if(l.packages&&l.packages[''])delete l.packages[''].version;process.stdout.write(require('crypto').createHash('sha256').update(JSON.stringify(l)).digest('hex'))")" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules and native builds
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            pkg-native
            vitest-native
            electron-native
          key: npm-deps-build-${{ runner.os }}-${{ runner.arch }}-node-24-${{ steps.deps.outputs.hash }}

      - name: Cache Electron, Electron Builder, and PKG binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/electron
            .cache/electron-builder
            .cache/pkg
          key: electron-builder-pkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.deps.outputs.hash }}
          restore-keys: |
            electron-builder-pkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Rebuild native modules
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm run rebuild

      - name: Download web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: web-build

      - name: Build & sign & notarize (macOS ${{ matrix.arch }})
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARCH: ${{ matrix.arch }}
        run: |
          npm run smoke-test
          node -e "const fs = require('fs'); ['win32', 'linux'].forEach(p => fs.rmSync('node_modules/onnxruntime-node/bin/napi-v6/' + p, { recursive: true, force: true }))"
          node -e "const fs = require('fs'); ['win32-arm64', 'win32-x64'].forEach(p => fs.rmSync('node_modules/node-pty/prebuilds/' + p, { recursive: true, force: true }))"
          node scripts/build-mcp-binary.js --mac --arch="$ARCH"
          if [ "$ARCH" = "arm64" ]; then
            chmod +x dist-mcp/cairn-mcp
            # The runner is arm64, so smoke-test:mcp only exercises the arm64 binary.
            npm run smoke-test:mcp
          else
            chmod +x dist-mcp/cairn-mcp-x64
          fi
          # electron-builder 26.15.3 creates its temp keychain with a random
          # password but runs `set-key-partition-list -k` with the *p12*
          # password — tolerated on macOS 26.5, rejected with SecKeychainUnlock
          # on 26.6 (runner image 20260831). Import the cert into our own
          # keychain with the correct password and hand it over via CSC_KEYCHAIN,
          # leaving CSC_LINK unset so the broken temp-keychain path is skipped.
          KEYCHAIN="${RUNNER_TEMP:-/tmp}/cairn-sign.keychain"
          KEYCHAIN_PW="$(openssl rand -base64 32)"
          printf '%s' "$CSC_LINK" | base64 --decode > /tmp/cairn-cert.p12
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security import /tmp/cairn-cert.p12 -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/productbuild -P "$CSC_KEY_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KEYCHAIN" || true
          rm -f /tmp/cairn-cert.p12
          export CSC_KEYCHAIN="$KEYCHAIN"
          unset CSC_LINK CSC_KEY_PASSWORD
          MAC_ARCH="$ARCH" npx electron-builder --mac --config scripts/electron-builder-mac-arch.js --publish never

      # Guard against the per-arch jobs drifting back to building both arches
      # (the other arch's app lacks its MCP binary, and the merged manifest
      # would pick the wrong entries).
      - name: Verify single-arch output
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ls -l dist-app/*.dmg dist-app/*.zip
          if [ "$ARCH" = "arm64" ]; then bad=$(ls dist-app/*.dmg dist-app/*.zip | grep -v arm64 || true)
          else bad=$(ls dist-app/*.dmg dist-app/*.zip | grep arm64 || true); fi
          if [ -n "$bad" ]; then echo "::error::unexpected other-arch artifacts: $bad"; exit 1; fi

      - name: Upload macOS assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mac-assets-${{ matrix.arch }}
          path: |
            dist-app/*.dmg
            dist-app/*.zip
            dist-app/*.blockmap
            dist-app/latest-mac.yml
          if-no-files-found: error
          retention-days: 1

  # ── Windows ───────────────────────────────────────────────────────────────
  build-win:
    name: Build Windows
    runs-on: windows-latest
    needs: [prepare-release, build-web]
    env:
      MSBUILDDISABLENODEREUSE: 1
      GYP_MSVS_VERSION: 2022

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Exclude workspace from Windows Defender
        run: Set-MpPreference -ExclusionPath ${{ github.workspace }}
        shell: powershell

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm

      # Hash of the dependency tree with the project's own version stripped.
      # The release script bumps `version` in package-lock.json on every tag, so
      # hashFiles('package-lock.json') missed every cache on every release.
      - name: Compute dependency hash
        id: deps
        shell: bash
        run: |
          echo "hash=$(node -e "const l=require('./package-lock.json');delete l.version;if(l.packages&&l.packages[''])delete l.packages[''].version;process.stdout.write(require('crypto').createHash('sha256').update(JSON.stringify(l)).digest('hex'))")" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules and native builds
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            pkg-native
            vitest-native
            electron-native
          key: npm-deps-build-${{ runner.os }}-${{ runner.arch }}-node-24-${{ steps.deps.outputs.hash }}

      - name: Cache Electron, Electron Builder, and PKG binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/electron
            .cache/electron-builder
            .cache/pkg
          key: electron-builder-pkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.deps.outputs.hash }}
          restore-keys: |
            electron-builder-pkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Rebuild native modules
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm run rebuild

      - name: Download web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: web-build

      - name: Build & publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run smoke-test
          node -e "const fs = require('fs'); ['darwin', 'linux'].forEach(p => fs.rmSync('node_modules/onnxruntime-node/bin/napi-v6/' + p, { recursive: true, force: true }))"
          node -e "const fs = require('fs'); ['darwin-arm64', 'darwin-x64'].forEach(p => fs.rmSync('node_modules/node-pty/prebuilds/' + p, { recursive: true, force: true }))"
          node scripts/build-mcp-binary.js --win
          npm run smoke-test:mcp
          npx electron-builder --win --publish onTagOrDraft

  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [prepare-release, build-web]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm

      # Hash of the dependency tree with the project's own version stripped.
      # The release script bumps `version` in package-lock.json on every tag, so
      # hashFiles('package-lock.json') missed every cache on every release.
      - name: Compute dependency hash
        id: deps
        shell: bash
        run: |
          echo "hash=$(node -e "const l=require('./package-lock.json');delete l.version;if(l.packages&&l.packages[''])delete l.packages[''].version;process.stdout.write(require('crypto').createHash('sha256').update(JSON.stringify(l)).digest('hex'))")" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules and native builds
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            pkg-native
            vitest-native
            electron-native
          key: npm-deps-build-${{ runner.os }}-${{ runner.arch }}-node-24-${{ steps.deps.outputs.hash }}

      - name: Cache Electron, Electron Builder, and PKG binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/electron
            .cache/electron-builder
            .cache/pkg
          key: electron-builder-pkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.deps.outputs.hash }}
          restore-keys: |
            electron-builder-pkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Rebuild native modules
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm run rebuild

      - name: Cross-compile node-pty for arm64 (Linux)
        if: steps.cache-npm.outputs.cache-hit != 'true'
        # node-pty has no Linux prebuild (compiled per-arch), so the arm64
        # target needs its own build. electron-builder builds x64 + arm64 from
        # this x64 runner, so cross-compile node-pty against the Electron arm64
        # headers and stage it as prebuilds/linux-arm64/ — node-pty's loader
        # falls back to prebuilds/<platform>-<arch> when build/Release fails to
        # load, so both arches coexist. Then restore the host (x64) build/Release.
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          cd node_modules/node-pty
          CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ \
            npx electron-rebuild -f -o node-pty --arch arm64
          mkdir -p prebuilds/linux-arm64
          cp build/Release/pty.node prebuilds/linux-arm64/pty.node
          npx electron-rebuild -f -o node-pty

      - name: Download web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: web-build

      - name: Build & publish (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run smoke-test
          node -e "const fs = require('fs'); ['win32', 'darwin'].forEach(p => fs.rmSync('node_modules/onnxruntime-node/bin/napi-v6/' + p, { recursive: true, force: true }))"
          node -e "const fs = require('fs'); ['darwin-arm64', 'darwin-x64', 'win32-arm64', 'win32-x64'].forEach(p => fs.rmSync('node_modules/node-pty/prebuilds/' + p, { recursive: true, force: true }))"
          node scripts/build-mcp-binary.js --linux
          chmod +x dist-mcp/cairn-mcp-linux-x64 dist-mcp/cairn-mcp-linux-arm64
          npm run smoke-test:mcp
          npx electron-builder --linux --publish onTagOrDraft

  # ── Publish the release ───────────────────────────────────────────────────
  # Runs only if all platform builds succeeded (default `needs`
  # semantics — any failed/cancelled dependency skips this job, so the release
  # stays a draft for manual inspection). Flips the draft off and, for a stable
  # (non-prerelease) tag, marks it as `latest` so auto-update picks it up.
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-mac, build-win, build-linux]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Download macOS assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: mac-assets-*
          path: mac-assets

      # Merge the per-arch update manifests and upload the mac assets (the mac
      # jobs build with --publish never so neither overwrites the other's yml).
      - name: Upload macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          node scripts/merge-latest-mac.js mac-assets/latest-mac.yml \
            mac-assets/mac-assets-arm64/latest-mac.yml mac-assets/mac-assets-x64/latest-mac.yml
          cat mac-assets/latest-mac.yml
          # One file at a time with retries: `gh release upload` pushes several
          # large files in parallel and a draft-release upload occasionally 404s
          # (seen on v3.0.20). --clobber makes a retry/re-run idempotent.
          for f in mac-assets/*/*.dmg mac-assets/*/*.zip mac-assets/*/*.blockmap mac-assets/latest-mac.yml; do
            ok=""
            for attempt in 1 2 3 4; do
              if gh release upload "$TAG" "$f" --clobber; then ok=1; break; fi
              echo "upload of $f failed (attempt $attempt); retrying…"
              sleep $((attempt * 10))
            done
            [ -n "$ok" ] || { echo "::error::could not upload $f"; exit 1; }
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Prerelease tags (containing a hyphen, e.g. v2.6.0-beta.1) are
          # published but must NOT become `latest` — only stable releases feed
          # auto-update.
          if [[ "$TAG" == *"-"* ]]; then
            gh release edit "$TAG" --draft=false --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi

