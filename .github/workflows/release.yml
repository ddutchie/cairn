name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  PKG_CACHE_PATH: ${{ github.workspace }}/.cache/pkg

jobs:
  # ── Create the GitHub Release with changelog body ─────────────────────────
  prepare-release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE="changelogs/${TAG}.md"
          PRERELEASE=""
          if [[ "$TAG" == *"-"* ]]; then PRERELEASE="--prerelease"; fi
          # Create as a draft first so the platform build jobs can upload their
          # DMG/installer assets to it. The final `publish-release` job flips the
          # draft off and marks it `latest` only after E2E + all three builds
          # pass — so a failed build leaves the release as an unpublished draft
          # (never shipped to auto-update users). To inspect a packaged build
          # before it goes public, cancel/fail the run or gate publish-release.
          if [ -f "$FILE" ]; then
            gh release create "$TAG" \
              --title "Cairn ${TAG}" \
              --notes-file "$FILE" \
              --draft \
              $PRERELEASE
          else
            gh release create "$TAG" \
              --title "Cairn ${TAG}" \
              --notes "No changelog found for ${TAG}." \
              --draft \
              $PRERELEASE
          fi

  # ── E2E smoke tests ───────────────────────────────────────────────────────
  smoke-e2e:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules
          key: npm-deps-${{ runner.os }}-${{ runner.arch }}-node-24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-${{ runner.arch }}-

      # Install browser binary only on cache miss — the binary is what's cached
      - name: Install Playwright Chromium binary
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # OS-level system deps (libglib, libnss, etc.) are not cacheable —
      # always install them; they're fast (apt, no download)
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Run E2E smoke tests
        # Generate the git-ignored artifacts the app/tests import (licenses.json
        # + new-features.json for the What's New smoke tests) before running.
        # The playwright.config webServer also does this, but generating here
        # keeps parity with ci.yml and guards against config drift.
        run: |
          node scripts/generate-licenses.js
          node scripts/generate-features.js
          npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── macOS ─────────────────────────────────────────────────────────────────
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    needs: [prepare-release, smoke-e2e]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules and native builds
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            pkg-native
            vitest-native
            electron-native
          key: npm-deps-build-${{ runner.os }}-${{ runner.arch }}-node-24-${{ hashFiles('package-lock.json') }}

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Electron, Electron Builder, and PKG binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/electron
            .cache/electron-builder
            .cache/pkg
          key: electron-builder-pkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-pkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Rebuild native modules
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm run rebuild

      - name: Build & publish (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node scripts/generate-licenses.js
          node scripts/generate-features.js
          npx cross-env ELECTRON_BUILD=true npx next build
          npm run compile
          npm run smoke-test
          node -e "const fs = require('fs'); ['win32', 'linux'].forEach(p => fs.rmSync('node_modules/onnxruntime-node/bin/napi-v6/' + p, { recursive: true, force: true }))"
          node -e "const fs = require('fs'); ['win32-arm64', 'win32-x64'].forEach(p => fs.rmSync('node_modules/node-pty/prebuilds/' + p, { recursive: true, force: true }))"
          node scripts/build-mcp-binary.js --mac
          chmod +x dist-mcp/cairn-mcp dist-mcp/cairn-mcp-x64
          npm run smoke-test:mcp
          npx electron-builder --mac --publish onTagOrDraft

  # ── Windows ───────────────────────────────────────────────────────────────
  build-win:
    name: Build Windows
    runs-on: windows-latest
    needs: [prepare-release, smoke-e2e]
    env:
      MSBUILDDISABLENODEREUSE: 1
      GYP_MSVS_VERSION: 2022

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Exclude workspace from Windows Defender
        run: Set-MpPreference -ExclusionPath ${{ github.workspace }}
        shell: powershell

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules and native builds
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            pkg-native
            vitest-native
            electron-native
          key: npm-deps-build-${{ runner.os }}-${{ runner.arch }}-node-24-${{ hashFiles('package-lock.json') }}

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Electron, Electron Builder, and PKG binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/electron
            .cache/electron-builder
            .cache/pkg
          key: electron-builder-pkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-pkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Rebuild native modules
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm run rebuild

      - name: Build & publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-licenses.js
          node scripts/generate-features.js
          npx cross-env ELECTRON_BUILD=true npx next build
          npm run compile
          npm run smoke-test
          node -e "const fs = require('fs'); ['darwin', 'linux'].forEach(p => fs.rmSync('node_modules/onnxruntime-node/bin/napi-v6/' + p, { recursive: true, force: true }))"
          node -e "const fs = require('fs'); ['darwin-arm64', 'darwin-x64'].forEach(p => fs.rmSync('node_modules/node-pty/prebuilds/' + p, { recursive: true, force: true }))"
          node scripts/build-mcp-binary.js --win
          npm run smoke-test:mcp
          npx electron-builder --win --publish onTagOrDraft

  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [prepare-release, smoke-e2e]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules and native builds
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            pkg-native
            vitest-native
            electron-native
          key: npm-deps-build-${{ runner.os }}-${{ runner.arch }}-node-24-${{ hashFiles('package-lock.json') }}

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Electron, Electron Builder, and PKG binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/electron
            .cache/electron-builder
            .cache/pkg
          key: electron-builder-pkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-pkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Rebuild native modules
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm run rebuild

      - name: Cross-compile node-pty for arm64 (Linux)
        if: steps.cache-npm.outputs.cache-hit != 'true'
        # node-pty has no Linux prebuild (compiled per-arch), so the arm64
        # target needs its own build. electron-builder builds x64 + arm64 from
        # this x64 runner, so cross-compile node-pty against the Electron arm64
        # headers and stage it as prebuilds/linux-arm64/ — node-pty's loader
        # falls back to prebuilds/<platform>-<arch> when build/Release fails to
        # load, so both arches coexist. Then restore the host (x64) build/Release.
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          cd node_modules/node-pty
          CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ \
            npx electron-rebuild -f -o node-pty --arch arm64
          mkdir -p prebuilds/linux-arm64
          cp build/Release/pty.node prebuilds/linux-arm64/pty.node
          npx electron-rebuild -f -o node-pty

      - name: Build & publish (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-licenses.js
          node scripts/generate-features.js
          npx cross-env ELECTRON_BUILD=true npx next build
          npm run compile
          npm run smoke-test
          node -e "const fs = require('fs'); ['win32', 'darwin'].forEach(p => fs.rmSync('node_modules/onnxruntime-node/bin/napi-v6/' + p, { recursive: true, force: true }))"
          node -e "const fs = require('fs'); ['darwin-arm64', 'darwin-x64', 'win32-arm64', 'win32-x64'].forEach(p => fs.rmSync('node_modules/node-pty/prebuilds/' + p, { recursive: true, force: true }))"
          node scripts/build-mcp-binary.js --linux
          chmod +x dist-mcp/cairn-mcp-linux
          npm run smoke-test:mcp
          npx electron-builder --linux --publish onTagOrDraft

  # ── Publish the release ───────────────────────────────────────────────────
  # Runs only if E2E and all three platform builds succeeded (default `needs`
  # semantics — any failed/cancelled dependency skips this job, so the release
  # stays a draft for manual inspection). Flips the draft off and, for a stable
  # (non-prerelease) tag, marks it as `latest` so auto-update picks it up.
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [smoke-e2e, build-mac, build-win, build-linux]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Prerelease tags (containing a hyphen, e.g. v2.6.0-beta.1) are
          # published but must NOT become `latest` — only stable releases feed
          # auto-update.
          if [[ "$TAG" == *"-"* ]]; then
            gh release edit "$TAG" --draft=false --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi

