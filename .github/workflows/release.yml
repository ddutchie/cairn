name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  PKG_CACHE_PATH: ${{ github.workspace }}/.cache/pkg

jobs:
  # ── Create the GitHub Release with changelog body ─────────────────────────
  prepare-release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE="changelogs/${TAG}.md"
          PRERELEASE=""
          if [[ "$TAG" == *"-"* ]]; then PRERELEASE="--prerelease"; fi
          # Always create as draft. After CI finishes building the DMG/installer,
          # the developer downloads it, smoke-tests the actual packaged app,
          # then promotes the release to public + latest so auto-update picks it up:
          #   gh release edit v2.1.x --draft=false
          # This prevents shipping a broken build (e.g. v2.1.4 umap-js crash) to
          # auto-update users before anyone has opened the actual .app.
          if [ -f "$FILE" ]; then
            gh release create "$TAG" \
              --title "Cairn ${TAG}" \
              --notes-file "$FILE" \
              --draft \
              $PRERELEASE
          else
            gh release create "$TAG" \
              --title "Cairn ${TAG}" \
              --notes "No changelog found for ${TAG}." \
              --draft \
              $PRERELEASE
          fi

  # ── E2E smoke tests ───────────────────────────────────────────────────────
  smoke-e2e:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@v6
        with:
          path: node_modules
          key: npm-deps-${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      # Install browser binary only on cache miss — the binary is what's cached
      - name: Install Playwright Chromium binary
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # OS-level system deps (libglib, libnss, etc.) are not cacheable —
      # always install them; they're fast (apt, no download)
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── macOS ─────────────────────────────────────────────────────────────────
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    needs: [prepare-release, smoke-e2e]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules and native builds
        id: cache-npm
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            pkg-native
            vitest-native
            electron-native
          key: npm-deps-build-${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Cache Electron, Electron Builder, and PKG binaries
        uses: actions/cache@v6
        with:
          path: |
            .cache/electron
            .cache/electron-builder
            .cache/pkg
          key: electron-builder-pkg-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-pkg-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Rebuild native modules
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm run rebuild

      - name: Build & publish (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node scripts/generate-licenses.js
          npx cross-env ELECTRON_BUILD=true npx next build
          npm run compile
          npm run smoke-test
          node -e "const fs = require('fs'); ['win32', 'linux'].forEach(p => fs.rmSync('node_modules/onnxruntime-node/bin/napi-v6/' + p, { recursive: true, force: true }))"
          node scripts/build-mcp-binary.js --mac
          chmod +x dist-mcp/cairn-mcp dist-mcp/cairn-mcp-x64
          npx electron-builder --mac --publish onTagOrDraft

  # ── Windows ───────────────────────────────────────────────────────────────
  build-win:
    name: Build Windows
    runs-on: windows-latest
    needs: [prepare-release, smoke-e2e]
    env:
      MSBUILDDISABLENODEREUSE: 1
      GYP_MSVS_VERSION: 2022

    steps:
      - uses: actions/checkout@v6

      - name: Exclude workspace from Windows Defender
        run: Set-MpPreference -ExclusionPath ${{ github.workspace }}
        shell: powershell

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules and native builds
        id: cache-npm
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            pkg-native
            vitest-native
            electron-native
          key: npm-deps-build-${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Cache Electron, Electron Builder, and PKG binaries
        uses: actions/cache@v6
        with:
          path: |
            .cache/electron
            .cache/electron-builder
            .cache/pkg
          key: electron-builder-pkg-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-pkg-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Rebuild native modules
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm run rebuild

      - name: Build & publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-licenses.js
          npx cross-env ELECTRON_BUILD=true npx next build
          npm run compile
          npm run smoke-test
          node -e "const fs = require('fs'); ['darwin', 'linux'].forEach(p => fs.rmSync('node_modules/onnxruntime-node/bin/napi-v6/' + p, { recursive: true, force: true }))"
          node scripts/build-mcp-binary.js --win
          npx electron-builder --win --publish onTagOrDraft

  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [prepare-release, smoke-e2e]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules and native builds
        id: cache-npm
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            pkg-native
            vitest-native
            electron-native
          key: npm-deps-build-${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Cache Electron, Electron Builder, and PKG binaries
        uses: actions/cache@v6
        with:
          path: |
            .cache/electron
            .cache/electron-builder
            .cache/pkg
          key: electron-builder-pkg-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-pkg-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Rebuild native modules
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm run rebuild

      - name: Build & publish (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-licenses.js
          npx cross-env ELECTRON_BUILD=true npx next build
          npm run compile
          npm run smoke-test
          node -e "const fs = require('fs'); ['win32', 'darwin'].forEach(p => fs.rmSync('node_modules/onnxruntime-node/bin/napi-v6/' + p, { recursive: true, force: true }))"
          node scripts/build-mcp-binary.js --linux
          chmod +x dist-mcp/cairn-mcp-linux
          npx electron-builder --linux --publish onTagOrDraft
