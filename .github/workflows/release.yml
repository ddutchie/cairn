name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Create the GitHub Release with changelog body ─────────────────────────
  prepare-release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE="changelogs/${TAG}.md"
          PRERELEASE=""
          if [[ "$TAG" == *"-"* ]]; then PRERELEASE="--prerelease"; fi
          if [ -f "$FILE" ]; then
            gh release create "$TAG" \
              --title "Cairn ${TAG}" \
              --notes-file "$FILE" \
              $PRERELEASE
          else
            gh release create "$TAG" \
              --title "Cairn ${TAG}" \
              --notes "No changelog found for ${TAG}." \
              $PRERELEASE
          fi

  # ── E2E smoke tests ───────────────────────────────────────────────────────
  smoke-e2e:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── macOS ─────────────────────────────────────────────────────────────────
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    needs: [prepare-release, smoke-e2e]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: nextjs-mac-${{ hashFiles('package-lock.json') }}
          restore-keys: nextjs-mac-

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build & publish (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node scripts/generate-licenses.js
          npx cross-env ELECTRON_BUILD=true npx next build
          npm run compile
          npm run smoke-test
          node scripts/build-mcp-binary.js --mac
          chmod +x dist-mcp/cairn-mcp dist-mcp/cairn-mcp-x64
          npx electron-builder --mac --publish always

  # ── Windows ───────────────────────────────────────────────────────────────
  build-win:
    name: Build Windows
    runs-on: windows-latest
    needs: [prepare-release, smoke-e2e]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: nextjs-win-${{ hashFiles('package-lock.json') }}
          restore-keys: nextjs-win-

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build & publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-licenses.js
          npx cross-env ELECTRON_BUILD=true npx next build
          npm run compile
          npm run smoke-test
          node scripts/build-mcp-binary.js --win
          npx electron-builder --win --publish always

  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [prepare-release, smoke-e2e]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: nextjs-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: nextjs-linux-

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build & publish (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-licenses.js
          npx cross-env ELECTRON_BUILD=true npx next build
          npm run compile
          npm run smoke-test
          node scripts/build-mcp-binary.js --linux
          chmod +x dist-mcp/cairn-mcp-linux
          npx electron-builder --linux --publish always
