appId: com.cairn.app
productName: Cairn
copyright: Copyright © 2026

directories:
  output: dist-app
  buildResources: build-resources

files:
  # Electron main + preload — esbuild bundles (all JS deps inlined)
  - dist-electron/**/*
  # MCP server — esbuild bundle (all JS deps inlined)
  - dist-mcp/mcp-server.bundle.js
  # Next.js static export
  - out/**/*
  # Electron-ABI native binary for better-sqlite3
  - electron-native/**/*
  # System-Node-ABI better-sqlite3 binary for the MCP server
  - mcp-native/**/*
  # better-sqlite3 native addon (cannot be bundled by esbuild)
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  # Exclude all other node_modules — everything else is inlined by esbuild
  - "!node_modules/!(better-sqlite3|bindings|file-uri-to-path)/**"

# Unpack from asar so native addons and the MCP bundle can load at runtime
asarUnpack:
  - dist-mcp/mcp-server.bundle.js
  - mcp-native/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*

# Rebuild native modules against Electron's Node version
npmRebuild: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build-resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist

dmg:
  sign: false

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build-resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
  icon: build-resources/icon.png
  category: Utility

# Don't publish automatically
publish: null
