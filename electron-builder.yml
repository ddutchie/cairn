appId: com.cairn.app
productName: Cairn
copyright: Copyright © 2026

directories:
  output: dist-app
  buildResources: build-resources

# Strip the non-target arch's native binaries from each per-arch pack (mac/win
# build arch: [arm64, x64]; without this every app ships BOTH arches' natives —
# incl. the ~84 MB other-arch MCP binary — as dead weight). See scripts/after-pack.js.
afterPack: scripts/after-pack.js

files:
  # Electron main + preload — esbuild bundles (all JS deps inlined)
  - dist-electron/**/*
  # Changelogs — displayed in Settings > About
  - changelogs/**/*
  # MCP server — self-contained binary (bundles Node 22 + better-sqlite3)
  - dist-mcp/cairn-mcp
  - dist-mcp/cairn-mcp.exe
  - dist-mcp/cairn-mcp-linux
  - dist-mcp/cairn-mcp-x64
  # Arch-matched better-sqlite3 sidecars staged next to the MCP binary by
  # build-mcp-binary.js. resolveMcpNativeBinding() loads these by process.arch so
  # the standalone binary can open the DB when run outside the app (agents run it
  # with the app closed). Without them the packaged binary crashes on startup
  # probing an un-embedded pkg snapshot path.
  - dist-mcp/better_sqlite3-arm64.node
  - dist-mcp/better_sqlite3-x64.node
  # Next.js static export
  - out/**/*
  # Electron-ABI better-sqlite3 binaries, arch-separated (electron-native/<arch>/)
  # so a universal macOS build ships both arm64 and x64. Resolved by process.arch.
  - electron-native/**/*
  # better-sqlite3 and its helpers — needed at runtime (native, can't be inlined)
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  # node-pty — native PTY addon, must be present at runtime
  - node_modules/node-pty/**/*
  # Runtime server externals — transformers.js + onnxruntime + sharp stub (in-process embeddings)
  - node_modules/@huggingface/transformers/**/*
  - node_modules/onnxruntime-node/**/*
  - node_modules/onnxruntime-common/**/*
  - node_modules/sharp/**/*
  - node_modules/umap-js/**/*
  - electron/sharp-stub/**/*
  # MCP SDK JSON-schema validator (ajv) — esbuild leaves ajv's dynamic codegen
  # requires external, so ajv + ajv-formats + their transitive deps must ship.
  - node_modules/ajv/**/*
  - node_modules/ajv-formats/**/*
  - node_modules/fast-deep-equal/**/*
  - node_modules/fast-uri/**/*
  - node_modules/json-schema-traverse/**/*
  - node_modules/require-from-string/**/*
  # Exclude everything else in node_modules
  - "!node_modules/!(better-sqlite3|bindings|file-uri-to-path|electron-updater|node-pty|@huggingface|onnxruntime-node|onnxruntime-common|sharp|umap-js|ajv|ajv-formats|fast-deep-equal|fast-uri|json-schema-traverse|require-from-string)/**"
  # Exclude source code, tests, and build intermediates from native modules to reduce size and signing overhead
  - "!node_modules/{better-sqlite3,node-pty}/{src,deps,docs,test,tests,obj,*.vcxproj,*.sln,*.vcxproj.filters}/**/*"
  - "!node_modules/{better-sqlite3,node-pty}/build/Release/*.{obj,pdb,lib,iobj,ipdb,tlog}"
  - "!node_modules/onnxruntime-node/src/**/*"
  - "!node_modules/onnxruntime-node/dist/src/**/*"

# Unpack from asar — native .node files and anything that needs real filesystem paths
asarUnpack:
  - electron-native/**/*
  - dist-mcp/cairn-mcp
  - dist-mcp/cairn-mcp.exe
  - dist-mcp/cairn-mcp-linux
  - dist-mcp/cairn-mcp-x64
  - dist-mcp/better_sqlite3-arm64.node
  - dist-mcp/better_sqlite3-x64.node
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - node_modules/electron-updater/**/*
  - node_modules/node-pty/**/*
  - node_modules/onnxruntime-node/**/*

# Native modules are pre-rebuilt by `npm run rebuild` — skip the redundant
# electron-builder rebuild during packaging to save time and avoid ABI mismatches.
npmRebuild: false

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build-resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  # Notarization is triggered automatically by electron-builder when
  # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID are set in the environment.
  # No config needed here — presence of those env vars is the switch.

dmg:
  sign: false

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build-resources/icon.ico

nsis:
  oneClick: false
  perMachine: true                     # installs to Program Files, requires UAC elevation
  allowElevation: true                 # prompt for elevation if not already admin
  allowToChangeInstallationDirectory: true
  installerIcon: build-resources/icon.ico
  uninstallerIcon: build-resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
  icon: build-resources/icon.png
  category: Utility

publish:
  provider: github
  releaseType: release
